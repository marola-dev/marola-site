name = "marola_client"
version = "0.1.0"
description = "The marola map page: a Lustre app on JavaScript with MapLibre and trail routes."
licences = ["MIT"]
repository = { type = "github", user = "marola-dev", repo = "marola-site" }
target = "javascript"

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
lustre = ">= 5.7.1 and < 6.0.0"
rsvp = ">= 1.0.0 and < 2.0.0"
marola_shared = { path = "../shared" }

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
