name: members

# Daily: move site/members.version to marola-dev/.github's main and rewrite members.html and its
# avatars (scripts/members_build.py), as one PR for a person to read, so a MEMBERS.md change or a
# new GitHub photo reaches the site without a hand-made pin bump. Never merges on its own.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: members
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: marola-pr-bot token
        id: bot
        uses: marola-dev/marola-devkit/.github/actions/bot-token@v0.20.1
        with:
          app-id: ${{ vars.PR_BOT_APP_ID }}
          private-key: ${{ secrets.PR_BOT_KEY }}
          repositories: marola-site
          permission-contents: write
          permission-pull-requests: write
      - name: Pin .github's main and rebuild the page
        run: |
          git ls-remote https://github.com/marola-dev/.github refs/heads/main | cut -f1 > site/members.version
          python3 scripts/members_build.py
      - name: Open or update the PR
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "members: up to date"; exit 0; fi
          branch=chore/members-sync
          sha="$(cut -c1-7 site/members.version)"
          git switch -C "$branch"
          git add -A site/members.version site/static/members.html site/static/img/members
          git commit -F - <<EOF
          chore(site): members from marola-dev/.github@$sha

          members.yml moved site/members.version to marola-dev/.github's main and ran
          scripts/members_build.py: the page and the avatars in img/members/ follow MEMBERS.md.

          Tested: scripts/members_build.py (members.yml)
          MIP: none — a data refresh from MEMBERS.md
          EOF
          gh auth setup-git
          git push -f origin "$branch"
          if ! gh pr view "$branch" --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr create --head "$branch" --title "chore(site): members from marola-dev/.github" \
              --body "members.yml: the members page and its avatars, rebuilt from marola-dev/.github's MEMBERS.md at main. Read the diff, then merge."
          fi
