name: site (build the boards, deploy the map)

# MIP-0005 §5.4: compute every area's board once on a schedule and publish site/dist as a static
# site — no server, no LLM, no per-visitor cost. MIP-0070 §5.4: the boards come from the pinned app
# image in marola-image; this repo never builds Scala.

on:
  schedule:
    - cron: "15 */3 * * *"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "marola-image"
      - "scripts/board-schema.sh"
      - "scripts/stamp_site_version.sh"
      - "scripts/mapbox_config.sh"
      - "scripts/br-proxy.sh"
      - "scripts/br-proxy-preflight.sh"
      - "ops/br-proxy/hosts"
      - ".github/workflows/site.yml"
  # The app's CI and docker-smoke.yml push coverage/ and smoke/ to site-data, the umbrella pushes
  # stats/, then each sends this so the panels refresh without waiting for the schedule.
  repository_dispatch:
    types: [site-data-updated]
  workflow_dispatch:
    inputs:
      area:
        description: "Area id from site/areas.json (empty = every area)"
        type: string
        default: ""

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

# Never two deploys at once; a queued run waits rather than cancelling a build that already paid
# for its Overpass query.
concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The build needs no Pages rights; only the deploy job below has them.
    permissions:
      contents: read
      packages: read
    env:
      HAS_TAILSCALE: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID != '' && secrets.TAILSCALE_OAUTH_SECRET != '' }}
    steps:
      - uses: actions/checkout@v7

      # #4: INEA (Rio) and INEMA (Bahia) answer only Brazilian addresses, so the build reaches them
      # through a node of the Brazilian proxy pool (ops/br-proxy/JOIN.md), over the org's tailnet.
      # The flight check fails closed: with no healthy node it stops the job here, before any board
      # is built, so nothing deploys and marola.dev keeps serving the last deployed site. The repo
      # variable BR_PROXY_REQUIRED=false (break glass) lets the build go on without the proxy.
      # The join's own failure is left to the flight check, which names it.
      - name: Join the tailnet (TAILSCALE_OAUTH_CLIENT_ID/TAILSCALE_OAUTH_SECRET)
        id: tailscale
        if: env.HAS_TAILSCALE == 'true'
        continue-on-error: true
        timeout-minutes: 2
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci

      # The first pool node that really reaches INEA becomes the upstream of a router on the
      # runner that sends only ops/br-proxy/hosts through it. MAROLA_BR_PROXY, if set, overrides
      # the pool with any HTTP proxy in Brazil.
      - name: Flight check, then route the Brazil-only agencies through the pool
        timeout-minutes: 3
        env:
          MAROLA_BR_PROXY: ${{ secrets.MAROLA_BR_PROXY }}
          BR_TAILNET: ${{ steps.tailscale.outcome }}
          BR_PROXY_REQUIRED: ${{ vars.BR_PROXY_REQUIRED }}
        run: |
          if [ -n "$MAROLA_BR_PROXY" ]; then
            upstream="$MAROLA_BR_PROXY"
          else
            upstream="$(scripts/br-proxy-preflight.sh)"
          fi
          [ -n "$upstream" ] || exit 0 # BR_PROXY_REQUIRED=false, already warned
          if ! command -v tinyproxy >/dev/null && ! { sudo apt-get update -qq && sudo apt-get install -y -qq tinyproxy >/dev/null; }; then
            scripts/br-proxy-preflight.sh --fail "could not install tinyproxy on the runner"
            exit
          fi
          opts="$(MAROLA_BR_PROXY="$upstream" scripts/br-proxy.sh start)"
          if [ -z "$opts" ]; then
            scripts/br-proxy-preflight.sh --fail "the runner's router did not come up through the chosen proxy"
            exit
          fi
          echo "BR_PROXY_JVM_OPTIONS=$opts" >>"$GITHUB_ENV"

      - name: The pinned app image (marola-image)
        id: image
        run: echo "ref=$(scripts/board-schema.sh --image)" >>"$GITHUB_OUTPUT"

      # ghcr.io/marola-dev/marola-app is a private package: it has to grant this repo read access
      # (package settings, "Manage Actions access") for GITHUB_TOKEN to pull it.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull it
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          for attempt in 1 2; do
            if docker pull -q "$IMAGE"; then exit 0; fi
            echo "docker pull attempt $attempt failed"
            [ "$attempt" -eq 2 ] || sleep 60
          done
          exit 1

      # The page is checked against the schema the image ships, not the vendored copy: the two can
      # only differ when a bump skipped `scripts/board-schema.sh --update`, and then this catches it.
      - name: site harness against the image's board schema
        run: |
          scripts/board-schema.sh --extract "$RUNNER_TEMP/board.schema.json"
          node --check site/static/app.js
          node --check site/static/flow.js
          BOARD_SCHEMA="$RUNNER_TEMP/board.schema.json" node scripts/site_check.js

      # The app reads site/beaches/<key>.json instead of asking Overpass, and writes one whenever a
      # query succeeds (marola-app's BeachSnapshot): the public mirrors time out often enough to
      # fail whole builds (#63). The lists live in the Actions cache, newest entry first.
      - name: Beach lists from earlier runs
        uses: actions/cache/restore@v6
        with:
          path: site/beaches
          key: beaches-
          restore-keys: beaches-

      # `--site` with no id builds every area; the water-quality provider is picked per area origin
      # (IMA/SC in Santa Catarina, INEA in Rio, INEMA in Bahia). The image runs as uid 10001, which
      # cannot write the runner's checkout, hence --user. With the route up, the container shares
      # the runner's network to reach it on 127.0.0.1, and JDK_JAVA_OPTIONS adds the proxy to the
      # image's own JAVA_TOOL_OPTIONS rather than replacing them.
      - name: Build the boards (Overpass only for an area with no saved beach list, no LLM)
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          AREA: ${{ inputs.area }}
        run: |
          args=(--site)
          [ -z "$AREA" ] || args+=("$AREA")
          br=()
          [ -z "${BR_PROXY_JVM_OPTIONS:-}" ] || br=(--network host -e "JDK_JAVA_OPTIONS=$BR_PROXY_JVM_OPTIONS")
          mkdir -p site/dist site/beaches
          for attempt in 1 2; do
            if docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp "${br[@]}" \
                 -v "$PWD/site:/work/site" -w /work "$IMAGE" \
                 "${args[@]}" --areas site/areas.json --site-out site/dist; then
              exit 0
            fi
            echo "site build attempt $attempt failed"
            [ "$attempt" -eq 2 ] || sleep 60
          done
          exit 1

      # Even after a failed build: a list written for one area before another timed out is kept.
      - name: Keep the beach lists
        if: always() && hashFiles('site/beaches/*.json') != ''
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: site/beaches
          key: beaches-${{ hashFiles('site/beaches/*.json') }}

      - name: What went through the Brazilian proxy
        if: always() && env.BR_PROXY_JVM_OPTIONS != ''
        continue-on-error: true
        run: |
          grep -aE '(Found|No) upstream proxy .*for ' "$RUNNER_TEMP/marola-br-proxy/tinyproxy.log" | sed 's/.*]: //' | sort | uniq -c || true
          scripts/br-proxy.sh stop

      # SiteBuilder writes board data only (MIP-0070 §5.4).
      - name: Copy the static page into dist
        run: cp -r site/static/. site/dist/

      # The base map is Mapbox's. Its token is public by design (it ships to every visitor), so it
      # is a pk. token restricted to marola.dev's URLs in the Mapbox account; the script refuses an
      # sk. one. A repo variable is enough; a secret of the same name wins if both exist.
      - name: Mapbox token and style into mapbox-config.js
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN || vars.MAPBOX_PUBLIC_TOKEN }}
          MAPBOX_STYLE: ${{ vars.MAPBOX_STYLE }}
          # no token, no deploy: the last good site (and its map) stays live until one is set
          MAPBOX_REQUIRE_TOKEN: "1"
        run: scripts/mapbox_config.sh site/dist

      # fix/site-smoke-panel-null: stamp index.html's app.js/style.css tags with `?v=<sha>` so
      # Pages' CDN (each file cached independently, `cache-control: max-age=600` per file) can never
      # serve a fresh index.html next to a stale-cached app.js or the reverse.
      - name: Cache-bust index.html's script/stylesheet tags
        run: scripts/stamp_site_version.sh site/dist

      # MIP-0008 §5.5: the panels' data lives on the orphan `site-data` branch, copied in here and
      # never deployed by the workflows that write it. The docs are docs.marola.dev's now.
      - name: Add the smoke-test, coverage and stats data (site-data branch, if any)
        run: |
          if git fetch --depth=1 origin site-data 2>/dev/null; then
            for dir in smoke coverage stats; do
              if git cat-file -e "FETCH_HEAD:$dir" 2>/dev/null; then
                git archive FETCH_HEAD "$dir" | tar -x -C site/dist
              else
                echo "no $dir/ on site-data yet — no $dir panel"
              fi
            done
          else
            echo "no site-data branch yet — no smoke/coverage/stats panel"
          fi

      - name: Show what was built
        run: |
          find site/dist -type f | sort
          echo
          cat site/dist/data/*/latest.json
          if [ -f site/dist/smoke/latest.json ]; then
            head -c 600 site/dist/smoke/latest.json
          fi

      # A half-built site must never reach Pages.
      - name: Required files — the page, the 404, the areas index, one latest.json per area
        run: |
          cd site/dist
          missing=0
          for f in index.html 404.html app.js ui.js i18n.js style.css flow.js mapbox-config.js \
                   vendor/mapbox-gl-csp.js vendor/mapbox-gl-csp-worker.js vendor/mapbox-gl.css data/areas.json \
                   $(python3 -c 'import json; [print("data/%s/latest.json" % a["id"]) for a in json.load(open("../areas.json"))]'); do
            if [ ! -f "$f" ]; then echo "missing: $f"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || { echo "site/dist is incomplete — not deploying"; exit 1; }

      # With actions/deploy-pages (not "Deploy from a branch"), the CNAME file has to travel inside
      # the artifact: there's no branch for GitHub to read it from.
      - name: Write the custom-domain CNAME file
        run: echo "marola.dev" > site/dist/CNAME

      # Only the map is public.
      - name: Publish allowlist — index.html, 404.html, about.html, support.html, favicon.svg, app.js, ui.js, i18n.js, style.css, flow.js, mapbox-config.js, chat.js, chatbot-config.js, CNAME, vendor/, data/, smoke/, coverage/, stats/ and nothing else
        run: |
          cd site/dist
          rm -f .gitkeep
          unexpected="$(find . -mindepth 1 \( -path ./data -o -path ./smoke -o -path ./coverage -o -path ./stats -o -path ./vendor \) -prune -o -type f ! -name index.html ! -name 404.html ! -name about.html ! -name support.html ! -name favicon.svg ! -name app.js ! -name ui.js ! -name i18n.js ! -name style.css ! -name flow.js ! -name mapbox-config.js ! -name chat.js ! -name chatbot-config.js ! -name CNAME -print)"
          if [ -n "$unexpected" ]; then
            echo "files in site/dist that are not on the publish allowlist:"; echo "$unexpected"; exit 1
          fi
          echo "publishing:"; find . -type f | sort

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
