name: site (build the boards, deploy the map)

# MIP-0005 §5.4: compute every area's board once on a schedule and publish site/dist as a static
# site — no server, no LLM, no per-visitor cost. MIP-0070 §5.4: the boards come from the pinned app
# image in marola-image; this repo never builds Scala.

on:
  schedule:
    - cron: "15 */3 * * *"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "marola-image"
      - "scripts/board-schema.sh"
      - "scripts/stamp_site_version.sh"
      - ".github/workflows/site.yml"
  # The app's CI and docker-smoke.yml push coverage/ and smoke/ to site-data, the umbrella pushes
  # stats/, then each sends this so the panels refresh without waiting for the schedule.
  repository_dispatch:
    types: [site-data-updated]
  workflow_dispatch:
    inputs:
      area:
        description: "Area id from site/areas.json (empty = every area)"
        type: string
        default: ""

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

# Never two deploys at once; a queued run waits rather than cancelling a build that already paid
# for its Overpass query.
concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: The pinned app image (marola-image)
        id: image
        run: echo "ref=$(scripts/board-schema.sh --image)" >>"$GITHUB_OUTPUT"

      # ghcr.io/marola-dev/marola-app is a private package: it has to grant this repo read access
      # (package settings, "Manage Actions access") for GITHUB_TOKEN to pull it.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull it
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          for attempt in 1 2; do
            if docker pull -q "$IMAGE"; then exit 0; fi
            echo "docker pull attempt $attempt failed"
            [ "$attempt" -eq 2 ] || sleep 60
          done
          exit 1

      # The page is checked against the schema the image ships, not the vendored copy: the two can
      # only differ when a bump skipped `scripts/board-schema.sh --update`, and then this catches it.
      - name: site harness against the image's board schema
        run: |
          scripts/board-schema.sh --extract "$RUNNER_TEMP/board.schema.json"
          node --check site/static/app.js
          BOARD_SCHEMA="$RUNNER_TEMP/board.schema.json" node scripts/site_check.js

      # The app serves each agency's last good fetch from data/water-cache when the agency does not
      # answer (CachedWaterQualityClient), but in a --rm container that file died with the run, so
      # an agency that never answers GitHub's runners (INEA, INEMA: #4) had nothing to fall back on.
      # The cache now carries it from build to build; site/water-cache/ seeds an agency it lacks.
      - name: Restore the water cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/water-cache
          key: water-cache-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: water-cache-

      # A seed replaces the cached file only when its newest sample is newer, so a refreshed seed
      # wins over an older fetch and never over a newer one.
      - name: Seed the water cache from site/water-cache/
        run: |
          shopt -s nullglob
          mkdir -p "$RUNNER_TEMP/water-cache"
          newest() { python3 -c 'import json,sys; print(max((s["sampled_on"] for p in json.load(open(sys.argv[1]))["points"] for s in p["samples"]), default=""))' "$1" 2>/dev/null || true; }
          for f in site/water-cache/*.json; do
            cached="$RUNNER_TEMP/water-cache/${f##*/}"
            if [ ! -s "$cached" ] || [[ "$(newest "$f")" > "$(newest "$cached")" ]]; then cp -v "$f" "$cached"; fi
          done
          for f in "$RUNNER_TEMP"/water-cache/*.json; do echo "${f##*/}: newest sample $(newest "$f")"; done

      # `--site` with no id builds every area; the water-quality provider is picked per area origin
      # (IMA/SC in Santa Catarina, INEA in Rio, INEMA in Bahia). The image runs as uid 10001, which
      # cannot write the runner's checkout, hence --user.
      - name: Build the boards (one Overpass query per area, no LLM)
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          AREA: ${{ inputs.area }}
        run: |
          args=(--site)
          [ -z "$AREA" ] || args+=("$AREA")
          mkdir -p site/dist
          for attempt in 1 2; do
            if docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
                 -v "$PWD/site:/work/site" -v "$RUNNER_TEMP/water-cache:/work/data/water-cache" \
                 -w /work "$IMAGE" \
                 "${args[@]}" --areas site/areas.json --site-out site/dist; then
              exit 0
            fi
            echo "site build attempt $attempt failed"
            [ "$attempt" -eq 2 ] || sleep 60
          done
          exit 1

      - name: Save the water cache
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/water-cache
          key: water-cache-${{ github.run_id }}-${{ github.run_attempt }}

      # SiteBuilder writes board data only (MIP-0070 §5.4).
      - name: Copy the static page into dist
        run: cp -r site/static/. site/dist/

      # fix/site-smoke-panel-null: stamp index.html's app.js/style.css tags with `?v=<sha>` so
      # Pages' CDN (each file cached independently, `cache-control: max-age=600` per file) can never
      # serve a fresh index.html next to a stale-cached app.js or the reverse.
      - name: Cache-bust index.html's script/stylesheet tags
        run: scripts/stamp_site_version.sh site/dist

      # MIP-0008 §5.5: the panels' data lives on the orphan `site-data` branch, copied in here and
      # never deployed by the workflows that write it. The docs are docs.marola.dev's now.
      - name: Add the smoke-test, coverage and stats data (site-data branch, if any)
        run: |
          if git fetch --depth=1 origin site-data 2>/dev/null; then
            for dir in smoke coverage stats; do
              if git cat-file -e "FETCH_HEAD:$dir" 2>/dev/null; then
                git archive FETCH_HEAD "$dir" | tar -x -C site/dist
              else
                echo "no $dir/ on site-data yet — no $dir panel"
              fi
            done
          else
            echo "no site-data branch yet — no smoke/coverage/stats panel"
          fi

      - name: Show what was built
        run: |
          find site/dist -type f | sort
          echo
          cat site/dist/data/*/latest.json
          if [ -f site/dist/smoke/latest.json ]; then
            head -c 600 site/dist/smoke/latest.json
          fi

      # A half-built site must never reach Pages.
      - name: Required files — the page, the 404, the areas index, one latest.json per area
        run: |
          cd site/dist
          missing=0
          for f in index.html 404.html app.js ui.js i18n.js style.css vendor/leaflet.js data/areas.json \
                   $(python3 -c 'import json; [print("data/%s/latest.json" % a["id"]) for a in json.load(open("../areas.json"))]'); do
            if [ ! -f "$f" ]; then echo "missing: $f"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || { echo "site/dist is incomplete — not deploying"; exit 1; }

      # With actions/deploy-pages (not "Deploy from a branch"), the CNAME file has to travel inside
      # the artifact: there's no branch for GitHub to read it from.
      - name: Write the custom-domain CNAME file
        run: echo "marola.dev" > site/dist/CNAME

      # Only the map is public.
      - name: Publish allowlist — index.html, 404.html, about.html, support.html, favicon.svg, app.js, ui.js, i18n.js, style.css, chat.js, chatbot-config.js, CNAME, vendor/, data/, smoke/, coverage/, stats/ and nothing else
        run: |
          cd site/dist
          rm -f .gitkeep
          unexpected="$(find . -mindepth 1 \( -path ./data -o -path ./smoke -o -path ./coverage -o -path ./stats -o -path ./vendor \) -prune -o -type f ! -name index.html ! -name 404.html ! -name about.html ! -name support.html ! -name favicon.svg ! -name app.js ! -name ui.js ! -name i18n.js ! -name style.css ! -name chat.js ! -name chatbot-config.js ! -name CNAME -print)"
          if [ -n "$unexpected" ]; then
            echo "files in site/dist that are not on the publish allowlist:"; echo "$unexpected"; exit 1
          fi
          echo "publishing:"; find . -type f | sort

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
