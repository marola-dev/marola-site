name: board schema

# site/board.schema.json must be the pinned image's own (MIP-0070 §5.4). Pulling the image is the
# slow part, so this runs only when the pin or the vendored copy changes; site.yml re-checks the
# page against the image's schema on every deploy.

on:
  push:
    branches: [main]
    paths: [marola-image, site/board.schema.json, scripts/board-schema.sh, .github/workflows/board-schema.yml]
  pull_request:
    paths: [marola-image, site/board.schema.json, scripts/board-schema.sh, .github/workflows/board-schema.yml]

permissions:
  contents: read
  packages: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # ghcr.io/marola-dev/marola is a private package: it has to grant this repo read access
      # (package settings, "Manage Actions access") for GITHUB_TOKEN to pull it.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: site/board.schema.json equals the one in the image marola-image pins
        run: scripts/board-schema.sh --check
