name: CI

# The devkit's reusable workflows at the pinned tag (MIP-0070 §5.6). Bump the tag here, the
# devkit-ref inputs and flake.nix's input together.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    uses: marola-dev/marola-devkit/.github/workflows/static-ci.yml@v0.15.0
    with:
      shellcheck-files: scripts/*.sh
      extra-commands: |
        node --check site/static/app.js
        node --check site/static/flow.js
        node --check site/static/ui.js
        node --check site/static/i18n.js
        python3 scripts/i18n_bundle.py --check
        python3 scripts/news_build.py --check
        python3 scripts/members_build.py --check
        node scripts/site_check.js
        node scripts/redirect_check.js
        git -c advice.detachedHead=false clone -q --depth 1 -b v0.15.0 https://github.com/marola-dev/marola-devkit /tmp/devkit && python3 /tmp/devkit/scripts/docs_lint.py .

  python:
    uses: marola-dev/marola-devkit/.github/workflows/python-ci.yml@v0.15.0
    with:
      self-test-commands: |
        python3 scripts/site_live_check.py --self-test
        python3 scripts/i18n_bundle.py --self-test
        python3 scripts/news_build.py --self-test
        python3 scripts/members_build.py --self-test
        scripts/site-data-push.sh --self-test
        scripts/board-schema.sh --self-test
        scripts/mapbox_config.sh --self-test
        scripts/mip-trailer-check.sh --self-test
        scripts/br-proxy.sh --self-test
        scripts/br-proxy-preflight.sh --self-test

  agents:
    uses: marola-dev/marola-devkit/.github/workflows/agents-check.yml@v0.15.0
    with:
      devkit-ref: v0.15.0

  # The one check ci-rule requires in every marola repo (marola-dev/marola#813); it must report on
  # every run, so it needs every other job and passes on skipped ones.
  ci-ok:
    if: always()
    needs: [static, python, agents]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: every needed job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::a needed job ended $r"; exit 1 ;; esac
          done
