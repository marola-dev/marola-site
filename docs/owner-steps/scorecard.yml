# DRAFT for .github/workflows/scorecard.yml. Not active: this branch may not edit .github/ (docs/7-quality.md, owner step 4).
#
# OpenSSF Scorecard scores the repository's own practices (branch protection, pinned actions, token permissions,
# dependency updates, a security policy, signed releases, ...), not the code. It reads repository settings that
# only an owner can see, and some checks need a token with more rights than the default one; without them a check
# reports "?" and not a score. [OPEN: owners. `publish_results: true` makes the result public on scorecard.dev and
# needs the repository to be public. Set it to false to keep the run private.]
#
# Actions are pinned by the SHAs Hermes resolved on 2026-11-11 (docs/owner-steps/pin-actions.md). `permissions: {}`
# before the jobs, then the least each job needs.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "17 5 * * 1"
  push:
    branches: [main]

permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          sarif_file: results.sarif
