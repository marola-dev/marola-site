<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>marola: not found</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <!-- The docs moved to docs.marola.dev (MIP-0070 §5.8). Pages cannot answer a missing path with
       a redirect, only with this page, so old /docs/* links are forwarded from here, path kept. -->
  <script>
    (function (l) {
      var m = /^\/docs(\/.*)?$/.exec(l.pathname);
      if (m) l.replace('https://docs.marola.dev' + (m[1] || '/') + l.search + l.hash);
    })(window.location);
  </script>
  <style>
    /* DESIGN.md's ink and type, with the system fallbacks: a relative font URL breaks at a nested path */
    body { font: 16px/1.65 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #111820; background: #fff; margin: 0; text-transform: lowercase; }
    main { max-width: 40rem; margin: 18vh auto 0; padding: 0 16px; }
    h1 { font-size: 34px; font-weight: 650; line-height: 1.15; letter-spacing: -.025em; margin: 0 0 16px; }
    a { color: #1b5fc1; text-underline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>not found</h1>
    <p>nothing lives at this address. <a href="/">back to the map</a>, or read the <a href="https://docs.marola.dev/">docs</a>.</p>
  </main>
</body>
</html>
