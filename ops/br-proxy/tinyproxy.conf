# tinyproxy on a machine with a Brazilian address, for marola-site's build (#4): GitHub's runners
# reach INEA (Rio) and INEMA (Bahia) through it. scripts/br-proxy.sh is the other end. Copy to
# /etc/tinyproxy/tinyproxy.conf with ./filter next to it; README.md has the steps.
User tinyproxy
Group tinyproxy
Port 8888
Timeout 120
MaxClients 20
LogLevel Notice
Syslog On

# Only the two agencies, for whoever asks: every other host is refused, so the proxy lends nothing.
FilterDefaultDeny Yes
Filter "/etc/tinyproxy/filter"
FilterType ere
ConnectPort 443

# And only for whoever holds the password, which is in the MAROLA_BR_PROXY secret.
BasicAuth marola CHANGE-ME
