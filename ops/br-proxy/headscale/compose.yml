# The tailnet's coordination server (#171): `just headscale up|down|logs|nodes|key-ci|key-node`.
# Needs ops/br-proxy/headscale/.env (HEADSCALE_HOST) and tcp 443 open to the internet.
name: marola-headscale

services:
  headscale:
    image: headscale/headscale:v0.29.5@sha256:780ed2f9e85719a2211277433f2c8afb45105d0d25031949a6848a485f9e216d
    command: serve
    environment:
      HEADSCALE_SERVER_URL: https://${HEADSCALE_HOST:?set HEADSCALE_HOST in ops/br-proxy/headscale/.env}
      HEADSCALE_TLS_LETSENCRYPT_HOSTNAME: ${HEADSCALE_HOST}
    ports:
      - "443:443"
    volumes:
      - ./config.yaml:/etc/headscale/config.yaml:ro
      - ./policy.hujson:/etc/headscale/policy.hujson:ro
      - data:/var/lib/headscale
    restart: unless-stopped

volumes:
  data:
