# Headscale v0.29.5, trimmed from its config-example.yaml. server_url and the ACME hostname come
# from HEADSCALE_SERVER_URL / HEADSCALE_TLS_LETSENCRYPT_HOSTNAME (compose.yml), not from here.
server_url: https://headscale.invalid
listen_addr: 0.0.0.0:443
metrics_listen_addr: 127.0.0.1:9090
grpc_listen_addr: 127.0.0.1:50443

noise:
  private_key_path: /var/lib/headscale/noise_private.key

prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48

# Tailscale's public relays: no embedded DERP, so the node only needs 443 open.
derp:
  server:
    enabled: false
  urls:
    - https://controlplane.tailscale.com/derpmap/default

# CI joins with an ephemeral key; the runner is gone in minutes.
node:
  ephemeral:
    inactivity_timeout: 30m

database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite

# tls-alpn-01 needs only :443 (no :80 to publish).
tls_letsencrypt_hostname: ""
tls_letsencrypt_cache_dir: /var/lib/headscale/cache
tls_letsencrypt_challenge_type: TLS-ALPN-01

policy:
  mode: file
  path: /etc/headscale/policy.hujson

dns:
  magic_dns: false
  override_local_dns: false

unix_socket: /var/run/headscale/headscale.sock
unix_socket_permission: "0770"
