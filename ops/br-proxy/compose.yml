# A Brazilian proxy pool node (#4): `just br-proxy-node up|down|status|check`, ops/br-proxy/JOIN.md.
# Both containers share one network namespace that is not the host's: nothing is published on the
# machine or its LAN, and the volunteer's own Tailscale, if any, is untouched.
name: marola-br-proxy

services:
  tailscale:
    image: tailscale/tailscale:v1.94.2@sha256:95e528798bebe75f39b10e74e7051cf51188ee615934f232ba7ad06a3390ffa1
    hostname: ${BR_PROXY_NODE_NAME:-br-proxy}
    environment:
      # From .env or the recipe's prompt, never the command line. Used once: the node's identity
      # then lives in the state volume, so a restart never needs (or reuses) the one-off key.
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_AUTH_ONCE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_HOSTNAME: ${BR_PROXY_NODE_NAME:-br-proxy}
      TS_EXTRA_ARGS: --advertise-tags=tag:br-proxy
    volumes:
      - state:/var/lib/tailscale
    restart: unless-stopped

  tinyproxy:
    build: .
    network_mode: service:tailscale
    depends_on: [tailscale]
    volumes:
      - ./node.conf:/etc/tinyproxy/tinyproxy.conf:ro
      - ./filter:/etc/tinyproxy/filter:ro
    restart: unless-stopped

volumes:
  state:
