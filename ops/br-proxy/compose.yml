# A Brazilian proxy pool node (#4): `just br-proxy-node up|down|status|check`, ops/br-proxy/JOIN.md.
# The proxy is published on BR_PROXY_PORT for the volunteer to forward on the router; it refuses
# every request without the password (BR_PROXY_USER:BR_PROXY_PASSWORD from .env) and every host
# outside ./hosts.
name: marola-br-proxy

services:
  proxy:
    build: .
    ports:
      - "${BR_PROXY_PORT:-8888}:8888"
    environment:
      BR_PROXY_AUTH: ${BR_PROXY_USER:?set BR_PROXY_USER in ops/br-proxy/.env}:${BR_PROXY_PASSWORD:?set BR_PROXY_PASSWORD in ops/br-proxy/.env (just br-proxy-node up generates one)}
      BR_PROXY_LISTEN: 0.0.0.0:8888
    volumes:
      - ./hosts:/etc/br-proxy/hosts:ro
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
