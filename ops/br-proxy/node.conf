# tinyproxy on a pool node (#4, JOIN.md): CI reaches INEA (Rio) and INEMA (Bahia) through it.
# It shares the tailscale container's network namespace and listens on that namespace's loopback
# only: tailscaled (userspace networking) hands it the tailnet's connections, and the machine's own
# network and LAN see no open port. The tailnet's grant lets only tag:ci reach it, on 8888.
Port 8888
Listen 127.0.0.1
Allow 127.0.0.1
Timeout 60
MaxClients 20
LogLevel Info

# Only the two agencies: every other host is refused (403), so the node lends nothing.
FilterDefaultDeny Yes
Filter "/etc/tinyproxy/filter"
FilterType ere
# HTTPS tunnels to 443 only. INEMA's first request is still plain http:// on port 80, which needs
# no tunnel; it stays allowed until marola-app requests https:// (see JOIN.md).
ConnectPort 443
